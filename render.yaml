services:
  - type: web
    name: prepwise
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PREPWISE_AI_ENABLED
        value: "true"
      - key: AI_TOKEN_BUDGET_PER_MINUTE
        value: "4000"
      - key: AI_REQUEST_BUDGET_PER_MINUTE
        value: "4"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "160"
