spring.application.name=prepwise

server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:prepwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
prepwise.jwt.secret=PrepWiseSecretKeyForJWTAuthenticationMustBeLongEnoughForHS256Algorithm2024
prepwise.jwt.expiration-ms=86400000

# CORS
prepwise.cors.allowed-origins=http://localhost:5173

# Demo seed
prepwise.seed.demo=true
