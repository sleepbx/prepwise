spring.application.name=prepwise

# Auto-load local API keys when application-local.properties exists (gitignored)
spring.config.import=optional:classpath:application-local.properties

server.port=${PORT:8080}

# SQLite — persistent, zero-setup, works on Render/Railway free tier
spring.datasource.url=jdbc:sqlite:./prepwise.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
# Set JWT_SECRET (32+ characters) in every deployed environment. If it is missing,
# the app generates a random key at startup and logs a warning.
prepwise.jwt.secret=${JWT_SECRET:}
prepwise.jwt.expiration-ms=86400000
prepwise.security.bcrypt-strength=${BCRYPT_STRENGTH:10}

# CORS — for local dev; in production frontend is same-origin (served by Spring Boot)
prepwise.cors.allowed-origins=${CORS_ORIGINS:*}

# Demo seed
prepwise.seed.demo=true
prepwise.seed.refresh-demo-password=${REFRESH_DEMO_PASSWORD:true}

# AI Intelligence Layer
prepwise.ai.enabled=${PREPWISE_AI_ENABLED:true}
prepwise.ai.groq.allow-auto-insights=${GROQ_ALLOW_AUTO_INSIGHTS:true}
prepwise.ai.token-budget-per-minute=${AI_TOKEN_BUDGET_PER_MINUTE:4000}
prepwise.ai.request-budget-per-minute=${AI_REQUEST_BUDGET_PER_MINUTE:4}
prepwise.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:160}
prepwise.ai.groq.api-key=${GROQ_API_KEY:}
prepwise.ai.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash-001}
