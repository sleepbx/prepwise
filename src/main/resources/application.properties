spring.application.name=prepwise

# Auto-load local API keys when application-local.properties exists (gitignored)
spring.config.import=optional:classpath:application-local.properties

server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:prepwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
prepwise.jwt.secret=PrepWiseSecretKeyForJWTAuthenticationMustBeLongEnoughForHS256Algorithm2024
prepwise.jwt.expiration-ms=86400000

# CORS
prepwise.cors.allowed-origins=http://localhost:5173

# Demo seed
prepwise.seed.demo=true

# AI Intelligence Layer - copy application-local.properties.example to application-local.properties
prepwise.ai.enabled=${PREPWISE_AI_ENABLED:true}
# Groq-only by default. Conservative budgets keep free-tier usage bounded; fallbacks are rule-based when budget is reached.
prepwise.ai.provider=${LLM_MODE:groq}
prepwise.ai.groq.allow-auto-insights=${GROQ_ALLOW_AUTO_INSIGHTS:true}
prepwise.ai.token-budget-per-minute=${AI_TOKEN_BUDGET_PER_MINUTE:4000}
prepwise.ai.request-budget-per-minute=${AI_REQUEST_BUDGET_PER_MINUTE:4}
prepwise.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:160}
prepwise.ai.groq.api-key=${GROQ_API_KEY:}
prepwise.ai.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash-001}
